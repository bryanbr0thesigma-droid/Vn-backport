name: Build and smoke test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: ./gradlew build
      - name: Smoke test on a dedicated server
        run: python3 tools/smoke_test.py
      - name: Install packs match the shipped jar
        run: python3 tools/make-mrpack.py --check
      - name: The shipped jar is the one that was just built
        run: |
          built=$(ls build/libs/villager-news-addon-port-1.3.6.jar)
          cmp "$built" dist/villager-news-addon-port-1.3.6-fabric-1.20.1.jar || echo "::warning::dist/ jar differs from the freshly built jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-log
          path: build/smoke-server/smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/villager-news-addon-port-1.3.6.jar
